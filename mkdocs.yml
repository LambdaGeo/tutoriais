site_name: Tutoriais
site_description: >
  Coleção de tutoriais práticos e independentes de programação e
  ferramentas de desenvolvimento.
site_author: "Sergio Souza Costa"

docs_dir: docs
site_dir: site

theme:
  name: material
  language: pt-BR
  features:
    - navigation.top
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate
    - toc.integrate
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Mudar para modo escuro
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Mudar para modo claro
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - attr_list
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/lambdageo.css

nav:
  - Início: index.md
  - Docker:
    - "Introdução": docker/index.md
    - "1. Docker CLI Puro: Exploração Guiada": docker/docker-cli-exploracao-guiada.md
    - "2. Ciclo de Vida, Efemeridade & Volumes": docker/ciclo-de-vida-efemeridade-volumes.md
    - "3. Tradução CLI → Docker Compose": docker/traducao-cli-docker-compose.md
    - "4. Otimização de Imagens + Dev vs Prod": docker/otimizacao-imagens-dev-vs-prod.md
    - "5. Tarefa: Polyglot Full-Stack": docker/tarefa-polyglot-full-stack.md
    - "Cheat Sheet": docker/cheat-sheet-docker-compose.md
  - Clojure:
    - "Introdução": clojure/index.md
    - "0. Fundação (Ambiente, Setup e Git)": clojure/00-fundacao.md
    - "1. Backend Mínimo (Hello World)": clojure/01-backend-minimo.md
    - "2. Backend Funcional (API em Memória)": clojure/02-backend-funcional.md
    - "3. Introdução ao Frontend (Reagent)": clojure/03-frontend-intro.md
    - "4. Conectando Frontend e Backend": clojure/04-integracao-frontend-backend.md
    - "5. Persistência Real (Banco de Dados)": clojure/05-persistencia.md
    - "6. CRUD Completo e Visual Final": clojure/06-crud-completo.md
    - "7. README e Entrega": clojure/07-readme-entrega.md
  - Elixir:
    - "Introdução": elixir/index.md
    - "0. Setup (Ambiente, Git e Esqueleto)": elixir/00-setup.md
    - "1. Hello World — Prova de Vida": elixir/01-hello-world.md
    - "2. Lógica em Memória": elixir/02-logica-memoria.md
    - "3. Persistência (Ecto, Repo, Migration, Schema)": elixir/03-persistencia.md
    - "4. O Transplante (LiveView + Banco)": elixir/04-transplante-liveview.md
    - "5. Refinamento — Excluindo Tarefas": elixir/05-excluindo-tarefas.md
    - "6. Refinamento — Concluindo Tarefas": elixir/06-concluindo-tarefas.md
    - "7. Personalizando o Design": elixir/07-personalizando-design.md
    - "8. README e Entrega": elixir/08-readme-entrega.md
  - Haskell:
    - "Introdução": haskell/index.md
    - "1. Tour pelo JSON e Preparação do Ambiente": haskell/01-tour-json-ambiente.md
    - "2. Representando JSON: Módulos e Compilação": haskell/02-representando-json.md
    - "3. Imprimindo e Renderizando Dados JSON": haskell/03-renderizacao-simples.md
    - "4. Impressão de Strings, Arrays e Objetos": haskell/04-impressao-strings-arrays.md
    - "5. Construindo a Biblioteca Prettify": haskell/05-biblioteca-prettify.md
    - "6. Exercícios, Empacotamento e Leitura": haskell/06-pacote-exercicios.md
    - "7. Preparando o Projeto e QuickCheck Básico": haskell/07-quickcheck-intro.md
    - "8. Estudo de Caso: Pretty Printer": haskell/08-estudo-caso-pretty-printer.md
    - "9. Cobertura de Testes com HPC": haskell/09-cobertura-hpc.md