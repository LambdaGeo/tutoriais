site_name: Tutoriais
site_description: >
  Coleção de tutoriais práticos e independentes de programação e
  ferramentas de desenvolvimento.
site_author: "Sergio Souza Costa"

docs_dir: docs
site_dir: site

theme:
  name: material
  language: pt-BR
  features:
    - navigation.top
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate
    - toc.integrate
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Mudar para modo escuro
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Mudar para modo claro
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - attr_list
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/lambdageo.css

nav:
  - Início: index.md
  - Docker:
    - "Introdução": docker/index.md
    - "1. Docker CLI Puro: Exploração Guiada": docker/docker-cli-exploracao-guiada.md
    - "2. Ciclo de Vida, Efemeridade & Volumes": docker/ciclo-de-vida-efemeridade-volumes.md
    - "3. Tradução CLI → Docker Compose": docker/traducao-cli-docker-compose.md
    - "4. Otimização de Imagens + Dev vs Prod": docker/otimizacao-imagens-dev-vs-prod.md
    - "5. Tarefa: Polyglot Full-Stack": docker/tarefa-polyglot-full-stack.md
    - "Cheat Sheet": docker/cheat-sheet-docker-compose.md